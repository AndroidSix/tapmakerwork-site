name: Refresh radar snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 与 pages.yml 共用同一组，避免两个部署抢同一 Pages 环境
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch TapTap and Steam boards
        run: node scripts/fetch-radar.mjs

      # 必须写回仓库：否则下一次 pages.yml 会用旧 data/*.json 覆盖线上快照
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar-snapshot.json data/radar-launches.json
          if git diff --cached --quiet; then
            echo "Radar snapshot unchanged"
          else
            git commit -m "chore: refresh radar snapshot data"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # artifact 上传成功后，deploy-pages 偶发读不到元数据；失败则短暂等待再部署一次
      - name: Deploy to GitHub Pages
        id: attempt1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Brief wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Resolve deployment URL
        id: deployment
        run: |
          if [ "${{ steps.attempt1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.attempt1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.attempt2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.attempt2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "Both deploy attempts failed" >&2
            exit 1
          fi
